; Each PHP process lives for one RoadRunner boot, so the shared memory cache is never
; read back. The file cache in /tmp does survive across invocations in the same
; execution environment.
opcache.enable=1
opcache.enable_cli=1
opcache.file_cache=/tmp
opcache.validate_timestamps=0
opcache.memory_consumption=32

; RoadRunner owns stdout as the goridge relay; diagnostics must go to stderr only.
display_errors=Off
log_errors=On
error_log=/dev/stderr

memory_limit=128M

zend.assertions=-1
date.timezone=UTC
